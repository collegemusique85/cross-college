<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>En direct — Cross</title>
<link rel="stylesheet" href="style.css?v=20261006a">
<style>
  body{background:var(--ink);color:#fff;min-height:100vh;overflow-x:hidden}
  .scr{padding:clamp(16px,2.4vw,40px);padding-top:clamp(10px,1.4vw,22px);display:flex;flex-direction:column;gap:clamp(14px,2vh,26px);min-height:calc(100vh - 50px)}
  /* barre de commandes flottante : ne prend pas de place à l'écran, disparaît quand la souris ne bouge plus */
  .ctl{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:#161C21F2;border:1px solid #39424B;border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px #0008;transition:opacity .6s;max-width:calc(100vw - 32px)}
  body.idle .ctl{opacity:0;pointer-events:none}
  .ctl select{background:#1A2026;color:#fff;border:1px solid #39424B;border-radius:8px;padding:8px 10px;font:inherit;font-size:15px}
  .go{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;background:var(--go);color:#062414}
  .go.stop{background:#fff;color:var(--ink)}
  .go.arm{background:var(--vest);color:var(--ink);animation:pulse .8s infinite alternate}
  @keyframes pulse{to{box-shadow:0 0 0 8px #F2C23055}}
  .ctl .hint{color:#9AA3AB;font-size:13px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .ttl .k{font-size:clamp(13px,1.1vw,17px);letter-spacing:.14em;text-transform:uppercase;color:var(--vest);font-weight:700}
  .ttl h1{font-size:clamp(28px,3.4vw,58px);line-height:1.05;letter-spacing:-.02em}
  .chrono{font-size:clamp(40px,6vw,104px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:.9}
  .chrono small{display:block;font-size:clamp(12px,1vw,16px);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9AA3AB;text-align:right;margin-top:6px}
  .stats{display:flex;gap:clamp(18px,3vw,56px);border-top:1px solid #2B333B;border-bottom:1px solid #2B333B;padding:clamp(10px,1.4vh,18px) 0;flex-wrap:wrap}
  .stat b{display:block;font-size:clamp(26px,3vw,50px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .stat span{font-size:clamp(12px,.95vw,15px);color:#9AA3AB;text-transform:uppercase;letter-spacing:.08em}
  .stat small{display:block;font-size:clamp(12px,.95vw,15px);color:#C9CED3;margin-top:2px;max-width:22ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* meilleurs tours : le nom du coureur bien visible, sur une ou deux lignes */
  .stat.best small{font-size:clamp(15px,1.35vw,24px);font-weight:700;color:#fff;max-width:18ch;white-space:normal;line-height:1.15;margin-top:4px}
  .stat.best small i{display:block;font-style:normal;font-weight:500;font-size:.72em;color:#9AA3AB}
  .stat.sep{border-left:1px solid #2B333B;padding-left:clamp(18px,3vw,56px)}
  .chrono.warn #chrono{color:var(--vest)}
  .chrono.over #chrono{color:#FF6B57;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  /* toutes les classes de la course dans un seul classement, sur deux colonnes */
  .board{display:grid;grid-auto-flow:column;column-gap:clamp(24px,3vw,56px);align-content:start}
  .board .lane{grid-template-columns:clamp(34px,2.6vw,48px) clamp(80px,6.6vw,120px) 1fr clamp(150px,11vw,210px)}
  .cl .nv{display:inline-block;margin-left:8px;font-size:.45em;font-weight:700;color:#9AA3AB;border:1px solid #39424B;border-radius:6px;padding:1px 6px;vertical-align:middle}
  .boardHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .boardHead b{font-size:clamp(18px,1.7vw,28px)}
  .boardHead span{font-size:clamp(11px,.9vw,15px);color:#9AA3AB;letter-spacing:.06em;text-transform:uppercase}
  /* vue compacte (beaucoup de classes) : tout tient sur un écran 1080p */
  body.compact .scr{gap:clamp(8px,1.3vh,16px)}
  body.compact .ttl h1{font-size:clamp(24px,2.6vw,46px)}
  body.compact .chrono{font-size:clamp(40px,4.8vw,92px)}
  body.compact .stats{padding:clamp(6px,1vh,12px) 0}
  body.compact .stat b{font-size:clamp(22px,2.4vw,42px)}
  body.compact .defi{padding:clamp(8px,1.1vh,14px) clamp(14px,1.6vw,26px)}
  body.compact .defi .pv{font-size:clamp(28px,3vw,52px)}
  body.compact .chase .who{font-size:clamp(16px,1.5vw,26px)}
  body.compact .board .lane{padding:clamp(3px,.55vh,7px) 0}
  body.compact .board .val small{display:inline;margin-left:10px}
  body.compact .board .val b{font-size:clamp(18px,1.7vw,30px)}
  body.compact .board .cl{font-size:clamp(18px,1.7vw,30px)}
  body.compact .board .lane{grid-template-columns:clamp(30px,2.4vw,44px) clamp(80px,6.6vw,120px) 1fr clamp(190px,14vw,260px)}

  /* Défi des profs */
  .defi{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2.4vw,44px);align-items:center;
    background:#161C21;border:1px solid #2B333B;border-left:6px solid var(--vest);border-radius:14px;padding:clamp(12px,1.6vh,20px) clamp(16px,1.8vw,30px)}
  .defi .k{font-size:clamp(12px,.95vw,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--vest);font-weight:700}
  .defi .pv{font-size:clamp(34px,4vw,70px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
  .defi .pv small{font-size:.32em;font-weight:600;color:#9AA3AB;letter-spacing:0;margin-left:6px}
  .defi .ps{color:#9AA3AB;font-size:clamp(12px,.95vw,15px)}
  .chase .who{font-size:clamp(18px,1.8vw,32px);font-weight:800;line-height:1.15}
  .chase .who em{font-style:normal;color:var(--vest)}
  .chase .who .ok{color:var(--go)}
  .track{position:relative;height:clamp(14px,1.8vh,22px);background:#20272E;border-radius:99px;margin-top:10px;overflow:visible}
  .track i{position:absolute;left:0;top:0;bottom:0;background:#E8ECEF;border-radius:99px;transition:width .9s ease}
  .track i.win{background:var(--go)}
  .track .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--vest);border-radius:2px}
  .track .goal::after{content:'profs';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--vest);letter-spacing:.08em;text-transform:uppercase}
  .chase .gap{margin-top:8px;color:#9AA3AB;font-size:clamp(12px,1vw,16px)}

  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:clamp(18px,2.6vw,48px);flex:1;align-content:start}
  .col h2{font-size:clamp(18px,1.7vw,28px);margin-bottom:clamp(8px,1vh,14px);display:flex;justify-content:space-between;align-items:baseline}
  .col h2 span{font-size:.6em;color:#9AA3AB;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .lane{display:grid;grid-template-columns:clamp(34px,2.6vw,48px) clamp(64px,5.4vw,96px) 1fr clamp(150px,12vw,220px);align-items:center;gap:12px;
    padding:clamp(5px,.8vh,10px) 0;border-bottom:1px dashed #2B333B}
  .rk{font-size:clamp(16px,1.4vw,24px);font-weight:800;color:#9AA3AB;font-variant-numeric:tabular-nums}
  .cl{font-size:clamp(20px,1.9vw,34px);font-weight:800;letter-spacing:-.01em}
  .bar{position:relative;height:clamp(14px,1.8vh,24px);background:#20272E;border-radius:99px}
  .bar i{display:block;height:100%;background:#E8ECEF;border-radius:99px;transition:width .9s ease}
  .bar .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--vest);opacity:.8}
  .val{text-align:right;font-variant-numeric:tabular-nums}
  .val b{font-size:clamp(20px,1.9vw,34px);font-weight:800}
  .val small{display:block;font-size:clamp(11px,.85vw,14px);color:#9AA3AB}
  .lane.first .rk,.lane.first .cl{color:var(--vest)}
  .lane.first .bar i{background:var(--vest)}
  .lane.beat .bar i{background:var(--go)}
  .star{display:inline-block;white-space:nowrap;margin-right:6px;font-size:clamp(10px,.8vw,13px);vertical-align:middle;background:var(--go);color:#062414;border-radius:99px;padding:2px 8px;font-weight:800;letter-spacing:.04em}

  /* Course à l'arrivée */
  .arr{display:grid;grid-template-columns:clamp(40px,3vw,56px) 1fr auto;gap:12px;align-items:center;padding:clamp(5px,.8vh,10px) 0;border-bottom:1px dashed #2B333B}
  .arr .nm{font-size:clamp(18px,1.7vw,30px);font-weight:800;line-height:1.1}
  .arr .nm small{display:block;font-size:.55em;color:#9AA3AB;font-weight:500}
  .arr .tp{font-size:clamp(20px,1.9vw,34px);font-weight:800;font-variant-numeric:tabular-nums}
  .arr.p1 .rk,.arr.p1 .nm{color:var(--vest)}
  /* Lycée : 3 colonnes (places 1-20, 21-40, 20 dernières arrivées), une ligne par coureur, hauteur ajustée à l'écran */
  body.lyc .scr{height:calc(100vh - 50px);min-height:0}
  .cols.trois{grid-template-columns:repeat(3,minmax(0,1fr));align-content:stretch;flex:1 1 0;min-height:0;overflow:hidden}
  .trois .col{display:grid;grid-template-rows:auto repeat(20,minmax(0,1fr));min-height:0;container-type:size;overflow:hidden}
  .trois .col h2{margin-bottom:4px;font-size:clamp(16px,min(4.2cqh,5cqw),30px)}
  .trois .arr{grid-template-columns:2.6em minmax(0,1fr) auto;gap:.6em;padding:0;font-size:clamp(11px,min(2vh,1.25vw),30px);font-size:clamp(11px,min(2.75cqh,4cqw),34px);border-bottom:1px dashed #2B333B}
  .trois .arr .rk{font-size:1em}
  .trois .arr .nm{font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trois .arr .nm small{display:inline;font-size:.72em;margin-left:.5em}
  .trois .arr .tp{font-size:1em}
  .trois .col.recent{border-left:1px solid #2B333B;padding-left:clamp(12px,1.4vw,28px)}
  .trois .recent .arr.nouv .nm,.trois .recent .arr.nouv .rk,.trois .recent .arr.nouv .tp{color:var(--go)}
  .trois .recent .arr.flash{animation:arrive 1.6s ease-out}
  @keyframes arrive{from{background:#2EE6A055}to{background:transparent}}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;color:#9AA3AB;font-size:clamp(12px,1vw,16px)}
  #feed{white-space:nowrap;overflow:hidden;flex:1;font-variant-numeric:tabular-nums}
  #feed em{font-style:normal;color:#fff;font-weight:700;margin-right:14px}
  .ghost{background:none;border:1px solid #39424B;color:#9AA3AB;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .empty{color:#9AA3AB;font-size:clamp(16px,1.3vw,22px);padding:20px 0}
  body.idle{cursor:none}
  @media (max-width:700px){ .defi{grid-template-columns:1fr} }
</style>
</head>

<script>/* si une page récente rencontre un ancien fichier en cache : message clair au lieu d'une page vide */
addEventListener('error',e=>{ if(/export|import|module/i.test(e.message||'')&&!document.getElementById('majBanner')&&document.body)
  document.body.insertAdjacentHTML('afterbegin','<div id="majBanner" class="banner err" style="position:relative;z-index:99">Le site vient d\'être mis à jour : rechargez la page (ou fermez et rouvrez le Web Clip).</div>'); });</script>
<div class="scr">
  <div class="ctl" id="ctl">
    <label class="hint">Course affichée <select id="coSel"></select></label>
    <label class="hint" id="vueW">Affichage <select id="vue"><option value="all">Toutes les classes</option><option value="niv">Par niveau</option></select></label>
    <button class="go" id="go" hidden>Donner le départ</button>
    <span class="hint" id="goHint"></span>
    <input type="file" id="nomFile" accept=".xlsx,.xls,.csv" hidden>
    <button class="ghost" id="nomBtn" title="Afficher les noms : ils restent sur cet ordinateur">Noms (Excel)…</button>
  </div>
  <header>
    <div class="ttl"><div class="k" id="kicker">En direct</div><h1 id="title">Cross du collège</h1></div>
    <div class="chrono"><span id="chrono">—</span><small id="chronoLbl">En attente du départ</small></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="defi" id="defi" hidden></div>
  <div class="cols" id="cols"></div>
  <div class="foot">
    <div id="feed"></div>
    <span id="net" class="pill"><i></i><span>…</span></span>
    <button class="ghost" id="fs">Plein écran</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import {$,esc,boot,compute,readCfg,niveauxDe,niveauxPresents,libNiveau,estArrivee,getNoms,setNoms,suivreNoms,publierNoms,parseWorkbook,prepareImport,fmtChrono,fr1,navBar,LS} from './app.js?v=20261006a';

navBar('direct.html',true);
const store=await boot();
const S={participants:{},scans:{},corrections:{},config:{}};
let tm=null, arme=null, armeT=null;
const q=new URLSearchParams(location.search);
let noms=getNoms(store.key);
store.onValue('participants',v=>{S.participants=v; later();});
store.onValue('corrections',v=>{S.corrections=v; later();});
store.onValue('config',v=>{S.config=v; later();});
store.onScanAdded(s=>{ S.scans[s.id]=s; later(); });
store.onConnected(c=>{ const n=$('net'); n.className='pill '+(c?'ok':'off'); n.querySelector('span').textContent=c?'en ligne':'hors ligne'; });

function later(){ if(!tm) tm=setTimeout(()=>{ tm=null; draw(); },700); }
const courseId=cfg=>{ const w=q.get('course'); return (w&&cfg.courses[w])?w:(cfg.courses[cfg.courant]?cfg.courant:cfg.ordre[0]); };
const nomCourt=d=>{ const n=noms[d]; return n?((n.prenom||'')+' '+(n.nom||'')).trim():''; };
const stat=(v,l,id,sub,cls)=>`<div class="stat${cls?' '+cls:''}"><b${id?' id="'+id+'"':''}>${v}</b><span>${l}</span>${sub!=null?'<small>'+sub+'</small>':''}</div>`;
let VUE=LS.get('cross.direct.vue','all')||'all';
$('vue').value=VUE;
$('vue').onchange=e=>{ VUE=e.target.value; LS.set('cross.direct.vue',VUE); draw(); };

function draw(){
  const res=compute(S), cfg=res.cfg, cid=courseId(cfg), co=cfg.courses[cid]||{nom:'Course',niveaux:''};
  $('title').textContent=estArrivee(co)?'Cross lycée':(cfg.titre||'Cross du collège');
  $('kicker').textContent='En direct · '+(co.nom||'Course '+cid);
  controls(cfg,cid,co);
  if(estArrivee(co)) drawArrivee(res,cfg,cid,co); else drawTours(res,cfg,cid,co);
  tick();
}

// ---------- commandes : course affichée + départ / fin, sans passer par Organisation
function controls(cfg,cid,co){
  const sel=$('coSel'), ids=cfg.ordre;
  const h=ids.map(id=>`<option value="${esc(id)}"${id===cid?' selected':''}>${esc(cfg.courses[id].nom||'Course '+id)}${cfg.courses[id].debut&&!cfg.courses[id].fin?' · en cours':''}</option>`).join('');
  if(sel.innerHTML!==h) sel.innerHTML=h;
  $('vueW').hidden=estArrivee(co);
  const b=$('go');
  if(arme===cid) return;               // bouton en attente de confirmation : on ne le redessine pas
  b.hidden=!!co.fin; b.classList.remove('arm');
  if(!co.debut){ b.textContent='Donner le départ'; b.className='go'; $('goHint').textContent=''; }
  else if(!co.fin){ b.textContent='Terminer la course'; b.className='go stop'; $('goHint').textContent=''; }
  else $('goHint').textContent='Course terminée — la rouvrir depuis Organisation si besoin.';
}
$('coSel').onchange=e=>{
  const id=e.target.value;
  if(q.get('course')){ q.set('course',id); history.replaceState(null,'','?'+q); draw(); }
  else store.update({'config/courant':id});
};
$('go').onclick=()=>{
  const cfg=readCfg(S.config), cid=courseId(cfg), co=cfg.courses[cid], b=$('go');
  if(arme!==cid){                      // 1er appui : armer (évite un départ par erreur)
    arme=cid; b.classList.add('arm');
    b.textContent=co.debut?'Confirmer la fin ?':'Confirmer le départ ?';
    const autres=Object.keys(cfg.courses).filter(id=>id!==cid&&cfg.courses[id].debut&&!cfg.courses[id].fin);
    $('goHint').textContent='Appuyez encore pour confirmer'+(!co.debut&&autres.length?' — « '+autres.map(id=>cfg.courses[id].nom).join(', ')+' » sera terminée':'');
    clearTimeout(armeT); armeT=setTimeout(()=>{ arme=null; draw(); },4000);
    return;
  }
  clearTimeout(armeT); arme=null;
  const P='config/courses/'+cid+'/';
  if(!co.debut){
    // une seule course ouverte à la fois : la précédente est terminée au départ de la suivante
    const u={[P+'debut']:store.now(),[P+'fin']:null,'config/courant':cid};
    for(const id in cfg.courses){ const c=cfg.courses[id]; if(id!==cid&&c.debut&&!c.fin) u['config/courses/'+id+'/fin']=store.now(); }
    store.update(u);
  }
  else if(!co.fin) store.update({[P+'fin']:store.now()});
  draw();
};

// ---------- course aux tours (collège) : classes par niveau + défi des profs
function drawTours(res,cfg,cid,co){
  $('cols').classList.remove('trois'); document.body.classList.remove('lyc');
  const cl=res.classes.filter(c=>c.course===cid);
  // Les adultes sont comptés une seule fois, même s'ils courent pour plusieurs classes.
  const P0=res.profs[cid]||{n:0,total:0};
  const tours=cl.reduce((a,c)=>a+c.te,0)+P0.total, run=cl.reduce((a,c)=>a+c.coureurs,0)+P0.n;
  const M=res.meilleurs[cid]||{}, E=M.eleve, A=M.adulte;
  // Nom en évidence, puis classe et numéro en petit. Élèves : noms chargés sur cet ordinateur ; adultes : nom saisi dans Organisation.
  const qui=L=>{ const p=L.p;
    if(!p||p.a) return esc(p&&p.n||'Adulte')+'<i>n° '+L.d+(p&&p.cr?' · '+esc(p.cr):'')+'</i>';
    const n=nomCourt(L.d); return (n?esc(n):'Dossard '+L.d)+'<i>'+esc(p.c)+(n?' · n° '+L.d:'')+'</i>'; };
  $('stats').innerHTML=stat(tours.toLocaleString('fr-FR'),'tours bouclés','sTours')+stat(fr1(tours*cfg.boucle),'kilomètres parcourus','sKm')+stat(run,'coureurs en piste','sRun')
    +stat(E?fmtChrono(E.v):'—','meilleur tour élève','sBestE',E?qui(E.L):'',' sep best')+stat(A?fmtChrono(A.v):'—','meilleur tour adulte','sBestA',A?qui(A.L):'',' best');

  const pr=res.profs[cid]||{n:0,moy:0,total:0}, pm=pr.n?pr.moy:0;
  const max=Math.max(1,pm,...cl.map(c=>c.moy));
  const goal=pm?`<span class="goal" style="left:${100*pm/max}%"></span>`:'';
  const lane=(c,i)=>{ const bat=pm>0&&c.moy>pm;
    return `<div class="lane${i===0&&c.moy>0?' first':''}${bat?' beat':''}">
      <div class="rk">${i+1}</div><div class="cl">${esc(c.c)}${VUE==='all'?'<span class="nv">'+libNiveau(c.niv)+'</span>':''}</div>
      <div class="bar"><i style="width:${Math.max(2,100*c.moy/max)}%"></i>${goal}</div>
      <div class="val">${bat?'<span class="star">★ bat les profs</span> ':''}<b>${fr1(c.moy)}</b><small>${c.te} tours${c.ta?' + '+c.ta+' adulte'+(c.ta>1?'s':''):''} · ${c.coureurs} élève${c.coureurs>1?'s':''}</small></div></div>`; };
  let niv=niveauxPresents(cfg,cid,res.classes);
  if(!niv.length) niv=niveauxDe(co).filter(n=>n!=='*');
  document.body.classList.toggle('compact',VUE==='all'&&cl.length>6);
  if(VUE==='all'){
    const rows=Math.max(1,cl.length>5?Math.ceil(cl.length/2):cl.length);
    $('cols').innerHTML=cl.length?`<div style="grid-column:1/-1"><div class="boardHead"><b>Classement des ${cl.length} classes</b><span>moyenne de tours par élève</span></div>
      <div class="board" style="grid-template-rows:repeat(${rows},auto)">${cl.map(lane).join('')}</div></div>`
      :'<div class="empty">Aucune classe dans cette course : vérifiez les niveaux dans Organisation › Réglages.</div>';
  } else $('cols').innerHTML=niv.map(n=>{
    const L=cl.filter(c=>c.niv===n);
    const rows=L.length?L.map(lane).join(''):'<div class="empty">Aucune classe de ce niveau.</div>';
    return `<div class="col"><h2><b>${libNiveau(n)}</b><span>moyenne de tours par élève</span></h2>${rows}</div>`;
  }).join('')||'<div class="empty">Aucune classe dans cette course : vérifiez les niveaux dans Organisation › Réglages.</div>';

  drawDefi(cl,pr,co);
  // derniers tours réellement comptés (pas les relectures)
  const feed=Object.values(S.scans).filter(s=>res.compte.has(s.id)).sort((a,b)=>b.t-a.t).slice(0,30)
    .map(s=>{ const p=S.participants[s.d]; return p?(p.a?(p.cr||'Prof'):p.c):null; }).filter(Boolean);
  $('feed').innerHTML=feed.length?'Derniers tours : '+feed.map(x=>'<em>'+esc(x)+'</em>').join(''):'';
}

function drawDefi(cl,pr,co){
  const el=$('defi');
  if(!co.debut){ el.hidden=true; return; }
  el.hidden=false;
  const left=`<div><div class="k">Défi · qui battra les profs ?</div>
    <div class="pv">${pr.n?fr1(pr.moy):'—'}<small>tours / prof</small></div>
    <div class="ps">${pr.n?pr.n+' prof'+(pr.n>1?'s':'')+' en piste · '+pr.total+' tours':'Aucun prof n\'a encore bouclé de tour'}</div></div>`;
  if(!pr.n){ el.innerHTML=left+'<div class="chase"><div class="who">Les profs ne sont pas encore passés sous l\'arche…</div></div>'; return; }
  const act=cl.filter(c=>c.coureurs>0);
  const bat=act.filter(c=>c.moy>pr.moy), egal=act.filter(c=>c.moy===pr.moy);
  const suiv=act.filter(c=>c.moy<pr.moy).sort((a,b)=>b.moy-a.moy)[0];
  let who, cible, win=false;
  if(bat.length){
    win=true; cible=bat[0];
    who=`<span class="ok">${bat.length===1?'Record battu par la':bat.length+' classes battent les profs :'} ${bat.slice(0,6).map(c=>'<em>'+esc(c.c)+'</em>').join(', ')}${bat.length>6?'…':''}</span>`;
  } else if(egal.length){
    cible=egal[0]; who=`<em>${esc(egal[0].c)}</em> est à égalité avec les profs !`;
  } else if(suiv){
    cible=suiv; who=`La plus proche : <em>${esc(suiv.c)}</em>`;
  } else { el.innerHTML=left+'<div class="chase"><div class="who">Aucune classe n\'a encore de tour.</div></div>'; return; }
  const max=Math.max(pr.moy,cible.moy)*1.08||1;
  const ecart=pr.moy-cible.moy;
  const gap=win?(suiv?`Prochaine menace : <b>${esc(suiv.c)}</b> à ${fr1(pr.moy-suiv.moy)} ${pr.moy-suiv.moy>=2?'tours':'tour'} des profs`:'Toutes les classes en piste ont battu les profs !')
    :ecart>0?`Il manque <b>${fr1(ecart)}</b> ${ecart>=2?'tours':'tour'} de moyenne à ${esc(cible.c)} (${fr1(cible.moy)}) — soit environ ${Math.max(1,Math.ceil(ecart*cible.coureurs))} tour${Math.ceil(ecart*cible.coureurs)>1?'s':''} de plus pour la classe.`:'';
  el.innerHTML=left+`<div class="chase"><div class="who">${who}</div>
    <div class="track"><i class="${win?'win':''}" style="width:${100*cible.moy/max}%"></i><span class="goal" style="left:${100*pr.moy/max}%"></span></div>
    <div class="gap">${gap}</div></div>`;
}

// ---------- course au classement d'arrivée (lycée) : du premier au dernier scanné
let dernierArr=null;
function drawArrivee(res,cfg,cid,co){
  $('defi').hidden=true; document.body.classList.remove('compact');
  const A=res.arrivees[cid]||{inscrits:0,arrives:[]}, L=A.arrives;
  const best=L.length&&L[0].temps!=null?fmtChrono(L[0].temps):'—';
  $('stats').innerHTML=stat(L.length,'arrivés','sArr')+stat(Math.max(0,A.inscrits-L.length),'encore en course','sRest')+stat(best,'meilleur temps');
  const ligne=(x,rk)=>{ const nm=nomCourt(x.d);
    return `<div class="arr${rk===1?' p1':''}"><div class="rk">${rk}</div>
      <div class="nm">${nm?esc(nm):'Dossard '+x.d}<small>${esc(x.p.c)}</small></div>
      <div class="tp">${x.temps!=null?fmtChrono(x.temps):'—'}</div></div>`; };
  // Une course du lycée = un sexe : le rang dans la course est le rang d'arrivée.
  const T=L.map((x,i)=>({...x,rc:i+1})), lab=co.sexe==='F'?'Filles':co.sexe==='G'?'Garçons':'Arrivées';
  const col=(titre,info,rows,cls)=>`<div class="col${cls?' '+cls:''}"><h2><b>${titre}</b><span>${info}</span></h2>${rows}</div>`;
  const vide='<div class="empty">Personne pour l\'instant.</div>';
  const recents=T.slice(-20).reverse(), nv=recents[0]?recents[0].d:null, flash=nv!==dernierArr; dernierArr=nv;
  const h=col(lab+' · 1 à 20',T.length+' arrivé'+(co.sexe==='F'?'e':'')+(T.length>1?'s':''),T.slice(0,20).map(x=>ligne(x,x.rc)).join('')||vide)
    +col('21 à 40','',T.slice(20,40).map(x=>ligne(x,x.rc)).join(''))
    +col('Dernières arrivées',recents.length?'les 20 dernières':'',recents.map((x,i)=>ligne(x,x.rc).replace('class="arr','class="arr'+(i===0?' nouv'+(flash?' flash':''):''))).join('')||vide,'recent');
  $('cols').classList.add('trois'); document.body.classList.add('lyc');
  $('cols').innerHTML=co.debut||L.length?h:'<div class="empty">Course au classement d\'arrivée : le premier dossard scanné après le départ est premier, et ainsi de suite.</div>';
  $('feed').innerHTML='';
}

function tick(){
  const cfg=readCfg(S.config), co=cfg.courses[courseId(cfg)]||{}, box=$('chrono').parentNode;
  const dec=!estArrivee(co)&&co.duree>0;          // collège : décompte de la durée de course
  box.classList.remove('warn','over');
  if(!co.debut){ $('chrono').textContent=dec?fmtChrono(co.duree*60000):'—'; $('chronoLbl').textContent=dec?'Durée de la course · en attente du départ':'En attente du départ'; return; }
  const fin=co.fin||store.now(), ecoule=fin-co.debut;
  if(!dec){ $('chrono').textContent=fmtChrono(ecoule); $('chronoLbl').textContent=co.fin?'Course terminée':'Temps de course'; return; }
  const reste=co.duree*60000-ecoule;
  if(co.fin){ $('chrono').textContent=fmtChrono(Math.max(0,reste)); $('chronoLbl').textContent='Course terminée · '+fmtChrono(ecoule)+' de course'; return; }
  if(reste>0){ $('chrono').textContent=fmtChrono(Math.ceil(reste/1000)*1000); $('chronoLbl').textContent='Temps restant';
    if(reste<=60000) box.classList.add('warn'); }
  else { $('chrono').textContent='0:00'; $('chronoLbl').textContent='Temps écoulé — terminer la course'; box.classList.add('over'); }
}
setInterval(tick,1000);
draw();

// Charger les noms sur l'ordinateur de projection (fichier Excel des élèves ; rien n'est envoyé en ligne)
$('nomBtn').onclick=()=>$('nomFile').click();
$('nomFile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const {rows}=parseWorkbook(XLSX.read(await f.arrayBuffer()));
  const r=prepareImport(rows,readCfg(S.config),S.participants||{});
  const ids=Object.keys(r.parts), P=S.participants||{};
  if(r.E.length||!ids.length||!ids.every(d=>P[d]&&P[d].c===r.parts[d].c)){ alert('Ce fichier ne correspond pas à la liste publiée : importez-le d\'abord dans Organisation.'); return; }
  noms={...noms,...r.noms}; setNoms(store.key,noms); draw();
  publierNoms(store,r.noms).catch(()=>{});
  alert(ids.length+' noms chargés sur cet ordinateur.');
};
// Noms en ligne (lien avec le code organisateur) : le bouton « Noms (Excel) » devient inutile.
suivreNoms(store,(n,e)=>{ noms=n; $('nomBtn').style.display=/^en ligne:[1-9]/.test(e)?'none':''; draw(); });
$('fs').onclick=()=>{ const d=document.documentElement; (d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d); };
let idle; const wake=()=>{ document.body.classList.remove('idle'); clearTimeout(idle); idle=setTimeout(()=>document.body.classList.add('idle'),4000); };
['mousemove','touchstart','keydown'].forEach(e=>addEventListener(e,wake,{passive:true})); wake();
</script>
