  table.rk td.dim{color:#9AA3AB}

<script type="module">
import {$,esc,boot,compute,niveauxDe,niveauxPresents,niveauDe,libNiveau,estArrivee,courseDe,estAdulteNum,fr1,fmtChrono,TYPES,getNoms,setNoms,suivreNoms,publierNoms,nomDe,
  parseWorkbook,exportWorkbook,exportParClasse,exportLyceeCSV,exportLyceeParClasse,classementLycee,statsLycee,libNivLycee,niveauLycee,ORDRE_LYCEE,idsLycee,coursesOrdonnees,trierIndiv,rangsIndiv,libMauvaise,LS,navBar} from './app.js?v=20261005d';

navBar('resultats.html',true);
const store=await boot();
const S={participants:{},scans:{},corrections:{},config:{}};
let noms=getNoms(store.key), res=null, tm=null;
store.onValue('participants',v=>{S.participants=v; later();});
store.onValue('corrections',v=>{S.corrections=v; later();});
store.onValue('config',v=>{S.config=v; later();});
store.onScanAdded(s=>{ S.scans[s.id]=s; later(); });
store.onConnected(c=>{ const n=$('net'); n.className='pill '+(c?'ok':'off'); n.querySelector('span').textContent=c?'en ligne':'hors ligne'; });
function later(){ if(!tm) tm=setTimeout(()=>{ tm=null; res=compute(S); draw(); },600); }

// ------------------------------------------------------------ catégories
const CATS_T=[['F','Groupes filles','g'],['G','Groupes garçons','g'],['M','Groupes mixtes','g'],['C','Classes'],
  ['iF','Filles'],['iG','Garçons'],['iT','Tous les élèves'],['iR','Tours les plus rapides'],['AD','Adultes']];
const CATS_A=[['F','Filles'],['G','Garçons'],['S','Général']];
const RK='cross.podium2.'+store.key;
let st=Object.assign({sec:null,cat:'F',cl:''},LS.get(RK,{}));
const save=()=>LS.set(RK,st);
const kLab=n=>/^\d$/.test(n)?n+'e':n;

// Sections : chaque niveau, chaque course (niveaux confondus), puis le lycée.
function sections(){
  const cfg=res.cfg, niv=[], comb=[], lyc=[], LY=idsLycee(cfg);
  // Lycée : un classement par course (un départ = une course), plus la 3PM à part.
  for(const id of LY){ const co=cfg.courses[id]; lyc.push({k:'lyc:'+id,ids:[id],arr:true,sexe:co.sexe||'',lab:esc(co.nom||'Lycée')}); }
  if(Object.values(S.participants||{}).some(p=>p&&!p.a&&LY.includes(courseDe(cfg,p))&&niveauLycee(p.c)==='3PM'))
    lyc.push({k:'lyc:3PM',ids:LY,arr:true,nivL:'3PM',lab:'3PM'});
  for(const [id,co] of coursesOrdonnees(cfg)){
    if(estArrivee(co)) continue;
    const N=[...new Set([...niveauxDe(co).filter(n=>n!=='*').map(n=>n.toUpperCase()[0]),...niveauxPresents(cfg,id,res.classes)])];
    for(const n of N) niv.push({k:'n:'+id+':'+n,ids:[id],niv:[n],lab:libNiveau(n)});
    if(N.length>1) comb.push({k:'c:'+id,ids:[id],niv:N,comb:true,lab:N.map(kLab).join('-')});
  }
  if(!lyc.length) lyc.push({k:'lycee',vide:true,lab:'Lycée'});
  return [...niv,...comb,...lyc];
}
// Lycée : une course = un sexe ; la 3PM (filles 2 tours, garçons 3 tours) n'a pas de classement mixte.
const catsDe=sec=>!sec?[]:sec.vide?[]:sec.arr?(sec.sexe?CATS_A.filter(c=>c[0]===sec.sexe):CATS_A.filter(c=>c[0]!=='S'))
  :CATS_T.filter(c=>c[0]!=='AD'||sec.comb);
// Section « Lycée » : tout le lycée, 3PM comprise (qui a aussi son bouton à part).
const dansSec=(sec,p)=>p&&!p.a&&(sec.arr?sec.ids.includes(courseDe(res.cfg,p))&&(!sec.nivL||niveauLycee(p.c)===sec.nivL)
  :sec.ids.includes(courseDe(res.cfg,p))&&sec.niv.includes(niveauDe(p.c)));
const mm=ms=>ms==null?'—':fmtChrono(ms);
const qui=L=>nomDe(noms,L)||(L.p&&L.p.a?'Adulte n° '+L.d:'Dossard '+L.d);

// Une liste = {rows:[{lab,sub,score,rang,cells:[]}], cols:[], note}
function liste(sec){
  const cfg=res.cfg, cat=st.cat, fcl=st.cl;
  if(sec.arr){
    // ordre d'arrivée ; le rang est recalculé dans la sélection (niveau, classe, sexe)
    const A=classementLycee(res,sec.ids).filter(x=>dansSec(sec,x.p));
    let L=cat==='S'?A:A.filter(x=>x.p.s===cat); if(fcl) L=L.filter(x=>x.p.c===fcl);
    const S2=statsLycee(A.filter(x=>!fcl||x.p.c===fcl)), ins=Object.values(res.lignes).filter(x=>dansSec(sec,x.p)&&!x.p.st&&(!fcl||x.p.c===fcl)).length;
    const f=(k,l)=>S2[k].n?l+' : '+S2[k].n+' arrivé'+(k==='F'?'e':'')+'s · meilleur temps '+fmtChrono(S2[k].best)+' · temps moyen '+fmtChrono(S2[k].moy):'';
    const note=[f('F','Filles'),f('G','Garçons'),(ins-A.filter(x=>!fcl||x.p.c===fcl).length>0?(ins-A.filter(x=>!fcl||x.p.c===fcl).length)+' pas encore arrivé(s)':'')].filter(Boolean).join('  —  ');
    const rows=L.map((x,i)=>({lab:qui(x),sub:x.p.c+' · n° '+x.d,score:x.temps!=null?fmtChrono(x.temps):'—',
      rang:i+1,cells:[qui(x),x.temps!=null?fmtChrono(x.temps):'—',x.p.c+' · n° '+x.d]}));
    // élèves de cette course scannés pendant une autre : affichés à la fin, sans rang
    const vus=new Set(A.map(x=>x.d));
    hors(sec,x=>!vus.has(x.d)&&(cat==='S'||x.p.s===cat)).forEach(x=>rows.push({mauv:true,rang:'—',cells:[qui(x),'—',x.p.c+' · n° '+x.d+' — '+libMauvaise(cfg,x)]}));
    return {cols:['Rang','Coureur','Temps','Classe'],note,rows,podium:rows.filter(r=>!r.mauv)};
  }
  const pr=sec.ids.map(id=>res.profs[id]).find(p=>p&&p.n), pm=pr?pr.moy:0;
  if(cat==='C'){
    const L=res.classes.filter(c=>sec.ids.includes(c.course)&&sec.niv.includes(c.niv)&&c.total>0);
    const R=rangsMoy(L);
    const rows=L.map((c,i)=>({lab:c.c,sub:c.te+' tours · '+c.coureurs+' élève'+(c.coureurs>1?'s':'')+(c.ta?' · + '+c.ta+' tours d\'adultes (hors moyenne)':''),
      score:fr1(c.moy)+' tours',rang:R[i],beat:pm>0&&c.moy>pm,m:c.moy,
      cells:[c.c+(sec.niv.length>1?' ('+kLab(c.niv)+')':''),fr1(c.moy),c.coureurs+' / '+c.inscrits,c.te+' tours élèves'+(c.ta?' + '+c.ta+' tours d\'adultes = '+c.total:'')]}));
    if(pr){ const at=rows.findIndex(r=>r.m<pr.moy);
      rows.splice(at<0?rows.length:at,0,{profs:true,cells:['Les profs (défi)',fr1(pr.moy),pr.n+' adulte'+(pr.n>1?'s':''),pr.total+' tours — hors classement']}); }
    return {cols:['Rang','Classe','Moyenne','Élèves ayant couru','Tours'],rows,podium:rows.filter(r=>!r.profs)};
  }
  if(['F','G','M'].includes(cat)){
    let L=res.groupes.filter(g=>sec.ids.includes(g.course)&&sec.niv.includes(g.niv)&&g.ty===cat&&g.moy>0);
    if(fcl) L=L.filter(g=>g.c===fcl);
    const R=rangsMoy(L);
    return {cols:['Rang','Groupe','Moyenne','Membres ayant couru','Tours de chacun'],rows:L.map((g,i)=>{
      const mem=g.membres.filter(m=>!m.p.st).map(m=>(nomDe(noms,m)||('n° '+m.d))+' ('+m.tours+')').join(', ');
      return {lab:g.c+' · '+g.g,sub:mem,score:fr1(g.moy)+' tours',rang:R[i],cells:[g.c+' · '+g.g,fr1(g.moy),g.coureurs+' / '+g.membres.length,mem]}; })};
  }
  if(cat==='AD'){
    const id=sec.ids[0], w=res.win[id];
    const L=Object.values(res.lignes).filter(x=>(x.p?x.p.a:estAdulteNum(x.d))&&!(x.p&&x.p.st)&&w)
      .map(x=>{ const lp=x.laps.filter(t=>t>=w.a&&t<=w.b); let b=null; for(let i=1;i<lp.length;i++){ const v=lp[i]-lp[i-1]; if(b==null||v<b) b=v; }
        return {...x,tours:lp.length,best:b,moy:lp.length>1?(lp[lp.length-1]-lp[0])/(lp.length-1):null}; }).filter(x=>x.tours>0);
    const T=trierIndiv(L), R=rangsIndiv(T);
    return {cols:['Rang','Adulte','Classe créditée','Tours','Km','Tour moyen','Meilleur tour'],rows:T.map((x,i)=>({lab:qui(x),
      sub:(x.p&&x.p.cr?'pour la '+x.p.cr:'sans classe')+' · meilleur tour '+mm(x.best),score:x.tours+' tours',rang:R[i],
      cells:[qui(x),x.p&&x.p.cr||'—',x.tours,fr1(x.tours*cfg.boucle),mm(x.moy),mm(x.best)]}))};
  }
  // individuels
  let L=Object.values(res.lignes).filter(x=>dansSec(sec,x.p)&&!x.p.st&&x.tours>0);
  if(cat==='iF') L=L.filter(x=>x.p.s==='F'); if(cat==='iG') L=L.filter(x=>x.p.s==='G');
  if(fcl) L=L.filter(x=>x.p.c===fcl);
  if(cat==='iR'){
    const T=L.filter(x=>x.best!=null).sort((a,b)=>a.best-b.best);
    let r=0,prev=null; const R=T.map((x,i)=>{ const k=Math.floor(x.best/1000); if(k!==prev){ r=i+1; prev=k; } return r; });
    return {cols:['Rang','Élève','Classe','Meilleur tour','Tour moyen','Tours'],rows:T.map((x,i)=>({lab:qui(x),sub:x.p.c+' · '+x.tours+' tours',score:mm(x.best),rang:R[i],
      cells:[qui(x),x.p.c+(x.p.s?' · '+x.p.s:''),mm(x.best),mm(x.moy),x.tours]})),note:'Temps entre deux passages sous les tablettes (le premier tour, depuis le départ, n\'est pas chronométré).'};
  }
  const T=trierIndiv(L), R=rangsIndiv(T);
  const rows=T.map((x,i)=>({lab:qui(x),
    sub:x.p.c+' · '+fr1(x.tours*cfg.boucle)+' km · tour moyen '+mm(x.moy),score:x.tours+' tours',rang:R[i],
    cells:[qui(x),x.p.c+(cat==='iT'&&x.p.s?' · '+x.p.s:''),x.tours,fr1(x.tours*cfg.boucle),mm(x.moy),mm(x.best)]}));
  hors(sec,x=>!x.tours&&(cat==='iT'||x.p.s===(cat==='iF'?'F':'G'))).forEach(x=>rows.push({mauv:true,rang:'—',cells:[qui(x),x.p.c+' — '+libMauvaise(cfg,x),0,'—','—','—']}));
  return {cols:['Rang','Élève','Classe','Tours','Km','Tour moyen','Meilleur tour'],rows,podium:rows.filter(r=>!r.mauv),
    note:'À égalité de tours, le tour moyen le plus rapide passe devant.'};
}
// Élèves de la section scannés seulement pendant une autre course (non comptés, mais listés).
function hors(sec,f){ const fcl=st.cl;
  return Object.values(res.lignes).filter(x=>x.mauvaise&&dansSec(sec,x.p)&&!x.p.st&&(!fcl||x.p.c===fcl)&&f(x)); }
function rangsMoy(L){ let r=0,prev=null; return L.map((x,i)=>{ const v=Math.round(x.moy*100); if(v!==prev){ r=i+1; prev=v; } return r; }); }

function draw(){
  if(!res) return;
  const SE=sections(); let sec=SE.find(x=>x.k===st.sec); if(!sec){ sec=SE[0]; st.sec=sec&&sec.k; }
  const CATS=catsDe(sec); if(CATS.length&&!CATS.some(c=>c[0]===st.cat)) st.cat=CATS[0][0];
  $('title').textContent=res.cfg.titre||'Cross';
  $('secs').innerHTML=SE.map(x=>`<button class="chip${x.k===st.sec?' on':''}" data-s="${esc(x.k)}">${x.lab}</button>`).join('');
  $('cats').innerHTML=CATS.map(([k,l,g])=>`<button class="chip${g?' grp':''}${k===st.cat?' on':''}" data-c="${k}">${l}</button>`).join('');
  // filtre classe : utile pour les groupes et les élèves
  const cls=sec&&!sec.vide?[...new Set(Object.values(S.participants||{}).filter(p=>p&&!p.a&&dansSec(sec,p)).map(p=>p.c))]
    .sort((a,b)=>a.localeCompare(b,'fr',{numeric:true})):[];
  if(st.cl&&!cls.includes(st.cl)) st.cl='';
  $('clSel').innerHTML='<option value="">Toutes</option>'+cls.map(c=>`<option${c===st.cl?' selected':''}>${esc(c)}</option>`).join('');
  $('clW').hidden=!sec||sec.vide||['C','AD'].includes(st.cat);
  $('csvLy').hidden=!(sec&&sec.arr); $('xlsLyCl').hidden=!(sec&&sec.arr); $('xlsCl').hidden=!!(sec&&(sec.arr||sec.vide));
  if(!sec||sec.vide){ $('kicker').textContent='Lycée'; $('catTitle').innerHTML='Le lycée n\'est pas encore configuré <span>— Organisation › Réglages</span>';
    $('podium').innerHTML=''; $('table').innerHTML=''; $('note').textContent=''; save(); return; }
  const catLab=CATS.find(c=>c[0]===st.cat)[1];
  $('kicker').textContent=sec.arr?'Classement à l\'arrivée':'Podiums';
  const Lst=liste(sec), P=Lst.podium||Lst.rows;
  $('catTitle').innerHTML=sec.lab+' · '+esc(catLab)+(st.cl&&!$('clW').hidden?' · '+esc(st.cl):''); $('note').textContent=Lst.note||'';
  const slot=(i,cls)=>{ const x=P[i]; if(!x) return `<div class="step ${cls}"></div>`;
    return `<div class="step ${cls}"><div class="who"><div class="g">${esc(x.lab)}</div><div class="m">${esc(x.sub)}${x.beat?' <span class="beat">a battu les profs</span>':''}</div></div>
      <div class="block"><div class="pl">${x.rang}</div><div class="sc">${esc(x.score)}</div></div></div>`; };
  $('podium').innerHTML=P.length?slot(1,'p2')+slot(0,'p1')+slot(2,'p3'):'<div class="hint">Aucun résultat dans cette catégorie.</div>';
  $('table').innerHTML='<tr>'+Lst.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+Lst.rows.map(r=>r.profs
    ?'<tr class="profs"><td class="n">défi</td>'+r.cells.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>'
    :'<tr'+(r.mauv?' class="mauv"':'')+'><td class="n">'+r.rang+'</td>'+r.cells.map((c,j)=>'<td'+(j?'':'')+'>'+(j===0?'<b>'+esc(c)+'</b>'+(r.beat?'<span class="beat">bat les profs</span>':''):esc(c))+'</td>').join('')+'</tr>').join('');
  save();
}
$('secs').onclick=e=>{ const b=e.target.closest('[data-s]'); if(b){ st.sec=b.dataset.s; st.cl=''; draw(); } };
$('cats').onclick=e=>{ const b=e.target.closest('[data-c]'); if(b){ st.cat=b.dataset.c; draw(); } };
$('clSel').onchange=e=>{ st.cl=e.target.value; draw(); };

$('names').onclick=()=>$('nameFile').click();
$('nameFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const wb=XLSX.read(await f.arrayBuffer());
  const {rows}=parseWorkbook(wb); const n={};
  for(const r of rows){ const d=parseInt(r.dossard,10); if(d) n[d]={nom:r.nom,prenom:r.prenom}; }
  noms={...noms,...n}; setNoms(store.key,noms); publierNoms(store,n).catch(()=>{});
  alert(Object.keys(n).length+' noms chargés sur cet ordinateur. Ils ne sont envoyés nulle part.');
  draw();
};
$('xls').onclick=()=>{ if(res) exportWorkbook(res,S,noms); };
$('xlsCl').onclick=()=>{ if(res) exportParClasse(res,noms); };
// Les exports du lycée portent toujours sur toutes ses courses.
$('xlsLyCl').onclick=()=>{ if(res) exportLyceeParClasse(res,noms,idsLycee(res.cfg)); };
$('csvLy').onclick=()=>{ if(res) exportLyceeCSV(res,noms,idsLycee(res.cfg)); };
// Noms en ligne (lien avec le code organisateur) : plus besoin de charger le fichier Excel.
suivreNoms(store,(n,e)=>{ noms=n; $('names').style.display=/^en ligne:[1-9]/.test(e)?'none':''; later(); });
</script>
</body>
